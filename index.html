<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLOCKTWO & MOON - 中轴对称艺术版</title>
    <style>
        :root {
            --bg-color: #0d0d0d;       /* 艺术馆深夜环境色 */
            --panel-bg: #141414;       /* 哑光面板中灰色 */
            --text-off: #262626;       /* 未激活的低调暗灰字母[cite: 2] */
            --text-on: #ffffff;        /* 激活（发光）状态的纯白字母[cite: 2] */
            --glow: rgba(255, 255, 255, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 物理面板容器 */
        .clock-container {
            width: 90vmin;
            height: 90vmin;
            max-width: 600px;
            max-height: 600px;
            background: var(--panel-bg);
            /* 底部留出 14% 的时尚大留白，专门给正中下方的月相提供呼吸感 */
            padding: 8% 8% 14% 8%; 
            border-radius: 2px;
            box-shadow: 0 60px 140px rgba(0,0,0,0.9);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 11x10 字母矩阵网格[cite: 2] */
        .matrix {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(10, 1fr);
            width: 100%;
            height: 100%;
            gap: 2%;
            z-index: 2;
        }

        .letter {
            color: var(--text-off);
            font-size: 3.5vmin;
            font-weight: 700;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 0.1em;
            transition: color 0.4s ease, text-shadow 0.4s ease; /* 丝滑呼吸感[cite: 2] */
            user-select: none;
        }

        @media (min-width: 660px) {
            .letter { font-size: 22px; }
        }

        /* 激活状态[cite: 2] */
        .letter.active, .dot.active {
            color: var(--text-on);
            text-shadow: 0 0 10px var(--glow);
        }

        /* 四个角落的精准分钟点[cite: 2] */
        .dot {
            position: absolute;
            width: 1.8%;
            height: 1.8%;
            background-color: var(--text-off);
            border-radius: 50%;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }
        .dot.active {
            background-color: var(--text-on);
            box-shadow: 0 0 8px var(--glow);
        }
        .top-left  { top: 4%; left: 4%; }
        .top-right { top: 4%; right: 4%; }
        .bottom-right { bottom: 4%; right: 4%; }
        .bottom-left  { bottom: 4%; left: 4%; }

        /* 正中下方、绝对纯净的先锋几何月相视窗 */
        .moon-sub-panel {
            position: absolute;
            bottom: 4.5%; /* 完美悬浮在最底部两颗分钟点的连线中央 */
            left: 50%;
            transform: translateX(-50%); /* 绝对居中 */
            width: 28px;  /* 精致内敛的小尺寸，中轴线上不需要太大，克制即美 */
            height: 28px;
            z-index: 3;
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <!-- 精准分钟点[cite: 2] -->
        <div class="dot top-left" id="dot-1"></div>
        <div class="dot top-right" id="dot-2"></div>
        <div class="dot bottom-right" id="dot-3"></div>
        <div class="dot bottom-left" id="dot-4"></div>

        <!-- 纯粹的字母时间矩阵[cite: 2] -->
        <div class="matrix" id="matrix"></div>

        <!-- 正中下方天文艺术月相 -->
        <div class="moon-sub-panel">
            <canvas id="moonCanvas"></canvas>
        </div>
    </div>

<script>
    // QLOCKTWO 标准官方 11x10 字母矩阵布局[cite: 2]
    const wordsMatrix = [
        ["I","T","L","I","S","A","S","A","M","P","M"],
        ["A","C","Q","U","A","R","T","E","R","D","C"],
        ["T","W","E","N","T","Y","F","I","V","E","X"],
        ["H","A","L","F","S","T","E","N","F","T","O"],
        ["P","A","S","T","E","R","U","N","I","N","E"],
        ["O","N","E","S","I","X","T","H","R","E","E"],
        ["F","O","U","R","F","I","V","E","T","W","O"],
        ["E","I","G","H","T","E","L","E","V","E","N"],
        ["S","E","V","E","N","T","W","E","L","V","E"],
        ["T","E","N","S","E","O","C","L","O","C","K"]
    ];

    // 坐标映射[cite: 2]
    const map = {
        it: [[0,0], [0,1]], is: [[0,3], [0,4]],
        a: [[1,0]], quarter: [[1,2], [1,3], [1,4], [1,5], [1,6], [1,7]],
        twenty: [[2,0], [2,1], [2,2], [2,3], [2,4], [2,5]],
        five_m: [[2,6], [2,7], [2,8], [2,9]],
        half: [[3,0], [3,1], [3,2], [3,3]], 
        ten_m: [[3,5], [3,6], [3,7]], to: [[3,9], [3,10]],          
        past: [[4,0], [4,1], [4,2], [4,3]],
        hr: {
            1: [[5,0], [5,1], [5,2]], 2: [[6,8], [6,9], [6,10]], 3: [[5,6], [5,7], [5,8], [5,9], [5,10]], 
            4: [[6,0], [6,1], [6,2], [6,3]], 5: [[6,4], [6,5], [6,6], [6,7]], 6: [[5,3], [5,4], [5,5]],
            7: [[8,0], [8,1], [8,2], [8,3], [8,4]], 8: [[7,0], [7,1], [7,2], [7,3], [7,4]],
            9: [[4,7], [4,8], [4,9], [4,10]], 10: [[9,0], [9,1], [9,2]],
            11: [[7,5], [7,6], [7,7], [7,8], [7,9], [7,10]], 12: [[8,5], [8,6], [8,7], [8,8], [8,9], [8,10]]
        },
        oclock: [[9,5], [9,6], [9,7], [9,8], [9,9], [9,10]]
    };

    // 生成 DOM 网格[cite: 2]
    const matrixEl = document.getElementById('matrix');
    const domMatrix = [];
    for (let r = 0; r < 10; r++) {
        domMatrix[r] = [];
        for (let c = 0; c < 11; c++) {
            const span = document.createElement('div');
            span.className = 'letter';
            span.innerText = wordsMatrix[r][c];
            matrixEl.appendChild(span);
            domMatrix[r][c] = span;
        }
    }

    // Canvas 几何月相引擎
    const mCanvas = document.getElementById('moonCanvas');
    const mCtx = mCanvas.getContext('2d');
    const mSize = 64; 
    mCanvas.width = mSize;
    mCanvas.height = mSize;
    const mCenter = { x: mSize / 2, y: mSize / 2 };
    const mRadius = mSize / 2 - 2;

    // 高精度天文月相算法 (儒略日驱动)
    function getPreciseMoonPhase() {
        const now = new Date();
        const julianDate = (now.getTime() / 86400000) + 2440587.5;
        const knownNewMoonJD = 2451550.26; 
        const synodicMonth = 29.530588853; 
        let phase = ((julianDate - knownNewMoonJD) / synodicMonth) % 1.0;
        return phase < 0 ? phase + 1.0 : phase;
    }

    // 渲染极简无阻隔几何月相
    function drawMoonComponent() {
        mCtx.clearRect(0, 0, mSize, mSize);
        const phase = getPreciseMoonPhase();

        mCtx.save();
        mCtx.beginPath();
        mCtx.arc(mCenter.x, mCenter.y, mRadius, 0, Math.PI * 2);
        mCtx.clip();

        // 暗面底色：极深哑光夜黑 (#050505)
        mCtx.fillStyle = '#050505';
        mCtx.fillRect(mCenter.x - mRadius, mCenter.y - mRadius, mRadius * 2, mRadius * 2);

        let cutX = mCenter.x - mRadius;

        if (phase <= 0.5) {
            // 盈月：从右侧推入纯白
            const litRatio = phase / 0.5;
            cutX = (mCenter.x + mRadius) - (litRatio * mRadius * 2);
            mCtx.fillStyle = '#ffffff';
            mCtx.fillRect(cutX, mCenter.y - mRadius, (mCenter.x + mRadius) - cutX, mRadius * 2);
        } else {
            // 亏月：亮面退守左侧 (当前2026年6月3日真实状态)
            const darkRatio = (phase - 0.5) / 0.5;
            cutX = (mCenter.x + mRadius) - (darkRatio * mRadius * 2);
            mCtx.fillStyle = '#ffffff';
            mCtx.fillRect(mCenter.x - mRadius, mCenter.y - mRadius, cutX - (mCenter.x - mRadius), mRadius * 2);
        }

        mCtx.restore();

        // 极其纤细的外圆几何轮廓线
        mCtx.strokeStyle = '#222222';
        mCtx.lineWidth = 0.8;
        mCtx.beginPath();
        mCtx.arc(mCenter.x, mCenter.y, mRadius, 0, Math.PI * 2);
        mCtx.stroke();
    }

    // 核心文本刷新函数[cite: 2]
    function updateClockText() {
        document.querySelectorAll('.letter, .dot').forEach(el => el.classList.remove('active'));

        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes();

        highlight(map.it);
        highlight(map.is);

        const dotsCount = minutes % 5;
        for (let i = 1; i <= dotsCount; i++) {
            document.getElementById(`dot-${i}`).classList.add('active');
        }

        const baseMins = minutes - dotsCount;
        let displayHour = hours % 12;
        displayHour = displayHour === 0 ? 12 : displayHour;

        if (baseMins === 0) {
            highlight(map.oclock);
        } else if (baseMins === 5) {
            highlight(map.five_m); highlight(map.past);
        } else if (baseMins === 10) {
            highlight(map.ten_m); highlight(map.past);
        } else if (baseMins === 15) {
            highlight(map.a); highlight(map.quarter); highlight(map.past);
        } else if (baseMins === 20) {
            highlight(map.twenty); highlight(map.past);
        } else if (baseMins === 25) {
            highlight(map.twenty); highlight(map.five_m); highlight(map.past);
        } else if (baseMins === 30) {
            highlight(map.half); highlight(map.past);
        } else {
            displayHour = (displayHour % 12) + 1;
            highlight(map.to);
            if (baseMins === 35) { highlight(map.twenty); highlight(map.five_m); }
            else if (baseMins === 40) { highlight(map.twenty); }
            else if (baseMins === 45) { highlight(map.a); highlight(map.quarter); }
            else if (baseMins === 50) { highlight(map.ten_m); }
            else if (baseMins === 55) { highlight(map.five_m); }
        }

        highlight(map.hr[displayHour]);
    }

    function highlight(coords) {
        if (!coords) return;
        coords.forEach(([r, c]) => {
            if (domMatrix[r] && domMatrix[r][c]) {
                domMatrix[r][c].classList.add('active');
            }
        });
    }

    // 统一定时同步
    function tick() {
        drawMoonComponent();
        updateClockText();
    }

    tick();
    setInterval(tick, 1000);
</script>
</body>
</html>
