<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLOCKTWO - Word Clock</title>
    <style>
        :root {
            --bg-color: #111111;
            --text-off: #222222;
            --text-on: #ffffff;
            --glow: rgba(255, 255, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* 外层容器，完美等比缩放，适配 Canva 画布拉伸 */
        .clock-container {
            width: 90vmin;
            height: 90vmin;
            max-width: 600px;
            max-height: 600px;
            background: #000;
            padding: 8%;
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 11x10 字母矩阵网格 */
        .matrix {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(10, 1fr);
            width: 100%;
            height: 100%;
            gap: 2%;
        }

        .letter {
            color: var(--text-off);
            font-size: 3.5vmin;
            font-weight: 700;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 0.1em;
            transition: color 0.4s ease, text-shadow 0.4s ease;
            user-select: none;
        }

        @media (min-width: 660px) {
            .letter { font-size: 22px; }
        }

        /* 激活（发光）状态 */
        .letter.active, .dot.active {
            color: var(--text-on);
            text-shadow: 0 0 10px var(--glow);
        }

        /* 四个角落的精准分钟点 */
        .dot {
            position: absolute;
            width: 2%;
            height: 2%;
            background-color: var(--text-off);
            border-radius: 50%;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }
        .dot.active {
            background-color: var(--text-on);
            box-shadow: 0 0 8px var(--glow);
        }
        .top-left  { top: 3%; left: 3%; }
        .top-right { top: 3%; right: 3%; }
        .bottom-right { bottom: 3%; right: 3%; }
        .bottom-left  { bottom: 3%; left: 3%; }
    </style>
</head>
<body>

    <div class="clock-container">
        <div class="dot top-left" id="dot-1"></div>
        <div class="dot top-right" id="dot-2"></div>
        <div class="dot bottom-right" id="dot-3"></div>
        <div class="dot bottom-left" id="dot-4"></div>

        <div class="matrix" id="matrix"></div>
    </div>

<script>
    // QLOCKTWO 标准 110 字母矩阵布局
    const wordsMatrix = [
        ["I","T","L","I","S","A","S","A","M","P","M"],
        ["A","C","Q","U","A","R","T","E","R","D","C"],
        ["T","W","E","N","T","Y","F","I","V","E","X"],
        ["H","A","L","F","S","T","E","N","F","T","O"],
        ["P","A","S","T","E","R","U","N","I","N","E"],
        ["O","N","E","S","I","X","T","H","R","E","E"],
        ["F","O","U","R","F","I","V","E","T","W","O"],
        ["E","I","G","H","T","E","L","E","V","E","N"],
        ["S","E","V","E","N","T","T","W","E","L","V","E"],
        ["T","E","N","S","E","O","C","L","O","C","K"]
    ];

    // 对应字母在矩阵中的坐标映射 (Row, Col) - 已全部校对修正
    const map = {
        it: [[0,0], [0,1]], is: [[0,3], [0,4]],
        a: [[1,0]], quarter: [[1,2], [1,3], [1,4], [1,5], [1,6], [1,7]],
        twenty: [[2,0], [2,1], [2,2], [2,3], [2,4], [2,5]],
        five_m: [[2,6], [2,7], [2,8], [2,9]],
        half: [[3,0], [3,1], [3,2], [3,3]], ten_m: [[3,7], [3,8]],
        to: [[3,9], [3,10]], past: [[4,0], [4,1], [4,2], [4,3]],
        hr: {
            1: [[5,0], [5,1], [5,2]], 
            2: [[6,8], [6,9], [6,10]], // 已修复：包含第8列的 'T'，不再显示为 WOE
            3: [[5,6], [5,7], [5,8], [5,9], [5,10]],
            4: [[6,0], [6,1], [6,2], [6,3]], 
            5: [[6,4], [6,5], [6,6], [6,7]], 
            6: [[5,3], [5,4], [5,5]],
            7: [[8,0], [8,1], [8,2], [8,3], [8,4]], 
            8: [[7,0], [7,1], [7,2], [7,3], [7,4]],
            9: [[4,7], [4,8], [4,9], [4,10]], 
            10: [[9,0], [9,1], [9,2]],
            11: [[7,5], [7,6], [7,7], [7,8], [7,9], [7,10]], 
            12: [[8,5], [8,6], [8,7], [8,8], [8,9], [8,10]]
        },
        oclock: [[9,5], [9,6], [9,7], [9,8], [9,9], [9,10]]
    };

    // 初始化生成 HTML 矩阵结构
    const matrixEl = document.getElementById('matrix');
    const domMatrix = [];

    for (let r = 0; r < 10; r++) {
        domMatrix[r] = [];
        for (let c = 0; c < 11; c++) {
            const span = document.createElement('div');
            span.className = 'letter';
            span.innerText = wordsMatrix[r][c];
            matrixEl.appendChild(span);
            domMatrix[r][c] = span;
        }
    }

    // 核心时间刷新函数
    function updateClock() {
        // 1. 清除所有高亮
        document.querySelectorAll('.letter, .dot').forEach(el => el.classList.remove('active'));

        // 2. 获取当前高精度本地时间
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes();

        // 3. 点亮永远在线的 "IT IS"
        highlight(map.it);
        highlight(map.is);

        // 4. 计算角落的 1-4 分钟精准点
        const dotsCount = minutes % 5;
        for (let i = 1; i <= dotsCount; i++) {
            document.getElementById(`dot-${i}`).classList.add('active');
        }

        // 5. 将分钟向下取到最接近的5的倍数
        const baseMins = minutes - dotsCount;

        // 6. 核心文本逻辑分支
        let displayHour = hours % 12;
        displayHour = displayHour === 0 ? 12 : displayHour;

        if (baseMins === 0) {
            highlight(map.oclock);
        } else if (baseMins === 5) {
            highlight(map.five_m); highlight(map.past);
        } else if (baseMins === 10) {
            highlight(map.ten_m); highlight(map.past);
        } else if (baseMins === 15) {
            highlight(map.a); highlight(map.quarter); highlight(map.past);
        } else if (baseMins === 20) {
            highlight(map.twenty); highlight(map.past);
        } else if (baseMins === 25) {
            highlight(map.twenty); highlight(map.five_m); highlight(map.past);
        } else if (baseMins === 30) {
            highlight(map.half); highlight(map.past);
        } else {
            // 超过30分钟，逻辑转为 "差几分到下一个小时"
            displayHour = (displayHour % 12) + 1;
            highlight(map.to);
            
            if (baseMins === 35) {
                highlight(map.twenty); highlight(map.five_m);
            } else if (baseMins === 40) {
                highlight(map.twenty);
            } else if (baseMins === 45) {
                highlight(map.a); highlight(map.quarter);
            } else if (baseMins === 50) {
                highlight(map.ten_m);
            } else if (baseMins === 55) {
                highlight(map.five_m);
            }
        }

        // 点亮对应小时
        highlight(map.hr[displayHour]);
    }

    // 辅助高亮函数
    function highlight(coords) {
        if (!coords) return;
        coords.forEach(([r, c]) => {
            if (domMatrix[r] && domMatrix[r][c]) {
                domMatrix[r][c].classList.add('active');
            }
        });
    }

    // 每秒高频同步，确保没有任何时间滞后
    setInterval(updateClock, 1000);
    updateClock();
</script>
</body>
</html>
